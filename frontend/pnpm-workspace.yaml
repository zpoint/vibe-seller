# Single-package "workspace" — pnpm 11+ requires a `packages:` field
# whenever this file exists, even though we only have one package
# rooted here. The actual reason this file exists is `allowBuilds`:
# pnpm 11+ refuses ignored post-install scripts in CI by default
# (esbuild / core-js / protobufjs need their native binaries), so
# they have to be explicitly approved here.
packages:
  - .

allowBuilds:
  core-js: true
  esbuild: true
  protobufjs: true

overrides:
  '@posthog/browser-common': 0.10.5
  '@posthog/types': 1.419.0
  # Security floors for transitive deps (Dependabot alerts).
  'brace-expansion@<1.1.21': ^1.1.21
  'brace-expansion@>=3 <5.0.12': ^5.0.12
  'minimatch@>=7 <11.0.1': ^11.0.1
  '@babel/core@<7.29.6': ^7.29.6
  '@humanfs/node@<0.16.8': ^0.16.8
  baseline-browser-mapping@<2.11.0: ^2.11.0
  browserslist@<4.28.7: ^4.28.7
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  flatted@<3.4.2: ^3.4.2
  form-data@>=4 <4.0.6: ^4.0.6
  js-yaml@>=4 <4.3.2: ^4.3.2
  nanoid@<3.3.12: ^3.3.12
  picomatch@>=4 <4.0.4: ^4.0.4
  postcss@<8.5.23: ^8.5.23
  postcss-selector-parser@<6.1.5: ^6.1.5
  seroval@<1.6.8: ^1.6.8
  source-map-js@<1.2.2: ^1.2.2
  ws@>=8 <8.21.0: ^8.21.0
  fflate@<0.4.9: ^0.4.9
  zod@<4.6.6: ^4.6.6
