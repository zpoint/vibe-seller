[project]
name = "vibe-seller-fake-vendor"
version = "0.0.0"
description = "Test-only fake browser vendor for the e2e guard replay"
requires-python = ">=3.11"

[project.entry-points."vibe_seller.plugins"]
fake_vendor = "fake_vendor:FakeVendorPlugin"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fake_vendor"]
