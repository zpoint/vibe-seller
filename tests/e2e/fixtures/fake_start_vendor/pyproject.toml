[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fake-start-vendor"
version = "0.0.0"
description = "E2E fixture: a browser backend whose start fails with a chosen inject-taxonomy code (test-only, never shipped)"
requires-python = ">=3.11"

[project.entry-points."vibe_seller.plugins"]
fake_start_vendor = "fake_start_vendor:FakeStartVendorPlugin"

[tool.setuptools]
packages = ["fake_start_vendor"]
