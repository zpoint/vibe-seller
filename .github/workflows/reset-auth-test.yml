name: Reset Auth Test

# The account-recovery command and its wrappers. It is its own workflow
# (not a job in ci.yml) so that the `paths` filter below can keep it from
# running on every PR: a change to a skill or a prompt has nothing to do
# with logging in, and the job cold-boots a server on two runners.
#
# The Windows path is the reason this is not a Linux-only check: the
# shipped wrappers are where the platform-specific breakage lives — path
# separators, the batch file's argument passing, and the Windows install
# layout.

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/auth_reset.py'
      - 'app/cli.py'
      - 'app/auth.py'
      - 'app/password.py'
      - 'app/config.py'
      - 'app/env_options.py'
      - 'app/database.py'
      - 'app/routers/auth.py'
      - 'app/schemas/user.py'
      - 'app/models/user.py'
      - 'app/models/app_settings.py'
      - 'scripts/reset_auth.sh'
      - 'scripts/reset_auth.bat'
      - 'tests/unit/test_auth_reset.py'
      - '.github/workflows/reset-auth-test.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # The account-recovery command ships to every platform, and the
  # wrappers are where the platform-specific breakage lives: path
  # separators, the batch file's argument passing, and the Windows
  # install layout. A Linux unit test cannot see any of that, so each
  # platform runs its own shipped wrapper here — against a real server
  # whose database the wrapper then resets.
  reset-auth-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv pip install -e .

      - name: Start the server (a cold first boot creates the database)
        shell: pwsh
        run: |
          # A cold first boot is what creates the database and seeds the
          # default admin — the state an install is in before anyone
          # changes the password.
          Remove-Item -Recurse -Force (Join-Path $HOME '.vibe-seller') `
            -ErrorAction SilentlyContinue
          # `uv run` keeps this the same command on both platforms
          # (the venv layout differs: bin/ vs Scripts\).
          uv run vibe-seller start --port 7778
          if ($LASTEXITCODE -ne 0) { throw "vibe-seller start failed" }
          # 90s: the cold first boot runs the full skills+knowledge sync
          # plus the DB init, which crosses 30s on a contended runner.
          for ($i = 0; $i -lt 90; $i++) {
            try {
              Invoke-RestMethod -Uri 'http://127.0.0.1:7778/api/health' `
                -TimeoutSec 2 | Out-Null
              Write-Host "Server healthy after ${i}s"
              exit 0
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          throw 'server did not become healthy'

      - name: Run the shipped wrapper (Linux sh, Windows bat)
        shell: pwsh
        run: |
          # The wrapper the user would actually run — not the module
          # behind it. On Linux that is scripts/reset_auth.sh, on
          # Windows scripts/reset_auth.bat.
          # NOT $IsWindows — that is a read-only PowerShell automatic
          # variable, and assigning to it aborts the step.
          $vsOnWindows = $env:OS -eq 'Windows_NT'
          function Invoke-Wrapper {
            param([string[]]$Arguments)
            if ($vsOnWindows) {
              & .\scripts\reset_auth.bat @Arguments
            } else {
              & bash ./scripts/reset_auth.sh @Arguments
            }
            if ($LASTEXITCODE -ne 0) {
              throw "reset_auth failed: $($Arguments -join ' ')"
            }
          }

          # 1. What the install looks like before anything is changed.
          Invoke-Wrapper @('status')

          # 2. Reset the password, restoring the canonical admin login.
          Invoke-Wrapper @(
            'password', '--user', 'admin', '--rename',
            '--password', 'ci-secret'
          )

          # 3. The new password logs in ...
          $body = @{identifier = 'admin'; password = 'ci-secret'} |
            ConvertTo-Json -Compress
          $resp = Invoke-RestMethod `
            -Uri 'http://127.0.0.1:7778/api/auth/login' -Method Post `
            -ContentType 'application/json' -Body $body
          if ($resp.username -ne 'admin') {
            throw "unexpected login response: $resp"
          }

          # 4. ... and the seeded default no longer does.
          $old = $null
          try {
            $old = Invoke-RestMethod `
              -Uri 'http://127.0.0.1:7778/api/auth/login' -Method Post `
              -ContentType 'application/json' `
              -Body (@{identifier = 'admin'; password = 'admin'} |
                ConvertTo-Json -Compress)
          } catch { }
          if ($old) { throw 'the old default password still logs in' }

          # 5. Turning the login screen off and on again.
          Invoke-Wrapper @('disable')
          $status = Invoke-RestMethod `
            -Uri 'http://127.0.0.1:7778/api/auth/status'
          if ($status.auth_required) { throw 'auth_required should be false' }
          Invoke-Wrapper @('enable')
          $status = Invoke-RestMethod `
            -Uri 'http://127.0.0.1:7778/api/auth/status'
          if (-not $status.auth_required) {
            throw 'auth_required should be true'
          }

          # 6. The server is still serving.
          Invoke-RestMethod -Uri 'http://127.0.0.1:7778/api/health' |
            Out-Null
          Write-Host 'OK: the shipped wrapper resets a password and the server keeps serving'

      - name: Stop the server
        shell: pwsh
        if: always()
        run: uv run vibe-seller stop --port 7778
