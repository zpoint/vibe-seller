name: CLI Upgrade Restart Test

# Proves `vibe-seller upgrade` leaves the running server on the NEW
# version: tests/releases/test_cli_upgrade_restart.sh builds this
# checkout as two versions, `uv tool install`s the older one (the
# install.sh layout), starts it, runs the real `vibe-seller upgrade`,
# and asserts the server booted again and serves the new version — with
# no manual start in between (the server restarts itself:
# app/upgrade_restart.py). The `release` leg starts instead from the
# latest stable release on PyPI — the upgrade users actually run — and
# checks a store created there survives (a release older than the
# self-restart is stopped and started once, as its users do).
#
# The `auto-update` job is the in-app path, ONE SCENARIO PER LEG, so a
# red leg names the behaviour that broke instead of just naming a job:
#
#   s1   OLD -> NEW on an idle machine with NOBODY clicking: the pip
#        path applies itself. Also holds #244's gate — a member's
#        restart gets 403, and one before `ready` gets 409.
#   s2   a task is running: the update must NOT apply while it runs,
#        and must apply on the first tick after it ends.
#   s5   NEW is a fabricated release that dies on boot: the apply must
#        fail, put OLD back, and leave OLD SERVING. Never a machine
#        with no server.
#   s5b  OLD -> v2 -> a broken v3: back on v2, not on OLD — what gets
#        rolled back to is the version that was actually serving.
#   s5c  S5, then the SAME broken release offered again after a fresh
#        boot: it must NOT be applied a second time. Without that rule
#        every six-hour cycle re-pays for one bad build — an outage on
#        a timer, forever (review 4). The idle tick refuses, the admin
#        is asked, and the record of the first outage is not rewritten.
#   s7   a dev build: never offered a version, never applies one.
#
# `twist` (workflow_dispatch) injects ONE named bug into the checkout
# first (tests/releases/twist.py --list) and every wheel a leg then
# upgrades between is built from that buggy tree. A leg that stays
# green under the twist that names it is a leg that checks nothing, so
# the dispatch is part of proving the legs, not an extra of them.
#
# A release gate (release.yml calls it via workflow_call), and also run
# on PRs touching the upgrade/restart surface. macOS and Linux because
# both ship through `vibe-seller upgrade`; native Windows upgrades via
# the installer and is covered by windows-upgrade.yml and the
# auto-update step in windows-installer.yml.

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      twist:
        description: >-
          Build from a checkout with ONE named bug injected first
          (tests/releases/twist.py --list prints these): wrong-path
          (the pip-vs-installer choice always answers pip, S4),
          no-rollback (the apply helper puts nothing back, S5/S5b),
          ignore-idle (the idle check always answers idle, S2),
          no-digest-check (the staged installer is never hashed, S6),
          raw-fingerprint (digests keep the checkout's line endings,
          S8), retry-bad (the idle tick re-applies a release this
          machine already rolled back, S5c), dev-updates (the dev
          channel is treated as stable, S7).
          'none' — the default — builds the code as it is. Any other
          name fails the job rather than quietly running untwisted.
        required: false
        default: 'none'
        type: string
      rehearse_gate:
        description: >-
          Also run the RELEASE GATE's Unix leg (the previous published
          release on PyPI -> this commit's wheel, LEG=s9) in this
          dispatch. It is the same leg pip-upgrade-gate.yml runs; that
          workflow cannot be dispatched while it exists only on a
          branch (GitHub answers HTTP 404 for a workflow file that is
          not on the default branch), so this is the path on which the
          gate's legs can be shown running before it ships.
        required: false
        default: false
        type: boolean
      gate_force:
        description: >-
          With rehearse_gate: fail on the gate's skip conditions instead
          of skipping, so the leg is shown capable of going red.
        required: false
        default: false
        type: boolean
      prev_version:
        description: 'Release to upgrade FROM (empty = newest stable on PyPI)'
        required: false
        default: ''
        type: string
  pull_request:
    branches: [main]
    paths:
      # The update surface: the two paths, the fingerprint that chooses
      # between them, the idle gate, the installer staging, the channel
      # rules, and everything that decides what is offered.
      - 'app/auto_update.py'
      - 'app/pip_update.py'
      - 'app/apply_launch.py'
      - 'app/pip_apply_helper.py'
      - 'app/update_idle.py'
      # The rule that a release this machine already rolled back is
      # never applied by itself again — it decides WHETHER an apply
      # happens, exactly like the idle gate beside it.
      - 'app/update_refusal.py'
      # What an apply actually runs on macOS/Linux: the exact-version
      # install and the receipt repair. A change here moves the apply
      # path without touching a single file above it.
      - 'app/uv_tool.py'
      - 'app/update_events.py'
      - 'app/windows_update.py'
      - 'app/upgrade_restart.py'
      - 'app/update_check.py'
      - 'app/bundle.py'
      - 'app/bundle_pins.json'
      - 'app/release_channel.py'
      - 'app/cli.py'
      - 'app/main.py'
      - 'app/routers/system.py'
      - 'app/scheduler/task_queue.py'
      # The triggers this job had before the pip path existed. Dropping
      # them would silently un-gate a change to the version string or
      # the platform probe that the restart test is written against.
      - 'app/version.py'
      - 'app/platform.py'
      - 'app/env_options.py'
      # What an install is made of, and what the bundle fingerprint
      # hashes: a change to either can move the pip/installer choice.
      - 'pyproject.toml'
      - 'uv.lock'
      - 'installer/windows/**'
      - 'scripts/bundle_fingerprint.py'
      - 'tests/releases/**'
      - '.github/workflows/cli-upgrade.yml'
      - '.github/workflows/windows-installer.yml'
      - '.github/workflows/bundle-fingerprint.yml'

concurrency:
  # A literal, not github.workflow: inside workflow_call that is the
  # CALLER's name, and two reusable gates of one release would share a
  # group and cancel each other.
  group: cli-upgrade-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  cli-upgrade-restart:
    name: upgrade from ${{ matrix.old }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # checkout: this checkout as OLD (the self-restart contract, with
        # a negative control). release: the latest stable release from
        # PyPI, as its users installed it, upgraded with its own CLI.
        old: [checkout, release]
    env:
      VIBE_SELLER_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          # setuptools-scm needs history to build; the test pins the
          # versions it builds, but the build backend still runs scm.
          fetch-depth: 0

      # Every twist's anchor text, checked without injecting anything:
      # a twist whose target line has moved would otherwise run the
      # pristine tree while the dispatch log claimed a bug was in it.
      # Cheap (one read per file) and it fails an unrelated PR only when
      # the proof-of-failure is genuinely broken.
      - name: Self-test the twists (anchor check, injects nothing)
        run: python3 tests/releases/twist.py --list

      # Before anything is built: the wheels this test upgrades between
      # have to carry the injected bug, not the pristine code. `none`
      # (and an absent input, on a PR or a release call) injects
      # nothing and says so.
      - name: Inject the named bug
        env:
          TWIST: ${{ inputs.twist }}
        run: python3 tests/releases/twist.py "$TWIST"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python 3.11
        run: uv python install 3.11

      # `vibe-seller upgrade` also moves the project-local Claude Code
      # CLI with npm — the real upgrade, run in full.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install lsof
        if: runner.os == 'Linux'
        run: sudo apt-get install -y lsof

      - name: Run the upgrade-restart test
        env:
          OLD_FROM: ${{ matrix.old }}
        run: bash tests/releases/test_cli_upgrade_restart.sh

  # The in-app auto-update path, one scenario per leg (see the map at
  # the top). macOS and Linux share this code path — there is no
  # installer here, so the pip path is the only path, and what these
  # legs prove is the PREFETCH, the IDLE GATE and the ROLLBACK. The
  # fingerprint that CHOOSES the path is Windows-side: S4 and S6 run in
  # windows-installer.yml, S8 in bundle-fingerprint.yml.
  auto-update:
    name: in-app auto-update ${{ matrix.leg }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      # Every leg runs even if a sibling fails: one red leg must not
      # hide whether the other four still work, and under a twist the
      # point of the run is exactly which leg caught it.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        leg: [s1, s2, s5, s5b, s5c, s7]
        # One fixed port per leg. test_auto_update.sh numbers its legs
        # PORT, PORT+1, … and refuses to start on a port that is
        # already serving, so legs that share a machine (a self-hosted
        # runner, or any future change here that keeps them on one)
        # would otherwise abort on each other's server. 7921-7925: a
        # band no other workflow in this repo uses.
        include:
          - leg: s1
            port: 7921
          - leg: s2
            port: 7922
          - leg: s5
            port: 7923
          - leg: s5b
            port: 7924
          - leg: s5c
            port: 7926
          - leg: s7
            port: 7925
    env:
      VIBE_SELLER_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Self-test the twists (anchor check, injects nothing)
        run: python3 tests/releases/twist.py --list

      - name: Inject the named bug
        env:
          TWIST: ${{ inputs.twist }}
        run: python3 tests/releases/twist.py "$TWIST"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install lsof
        if: runner.os == 'Linux'
        run: sudo apt-get install -y lsof

      # Which legs THIS twist is supposed to turn red. A green leg under
      # a twist that names a Windows scenario is not a pass — it is this
      # workflow being the wrong place to look — so say that in the log
      # instead of letting the check list imply it was proved.
      - name: Say what this run is testing
        env:
          TWIST: ${{ inputs.twist }}
        run: |
          case "${TWIST:-none}" in
            ''|none)
              echo 'twist=none: every leg runs the code as it is.'
              ;;
            no-rollback)
              echo 'twist=no-rollback: legs s5 and s5b are EXPECTED' \
                   'TO GO RED (nothing is put back, and the machine' \
                   'is left with no server).'
              ;;
            ignore-idle)
              echo 'twist=ignore-idle: leg s2 is EXPECTED TO GO RED' \
                   '(an update restarts a server that is in' \
                   "somebody's task)."
              ;;
            retry-bad)
              echo 'twist=retry-bad: leg s5c is EXPECTED TO GO RED' \
                   '(a release this machine already rolled back is' \
                   'applied again: one outage per check cycle, for a' \
                   'build that cannot boot).'
              ;;
            dev-updates)
              echo 'twist=dev-updates: leg s7 is EXPECTED TO GO RED' \
                   '(a dev build starts fetching published releases).'
              ;;
            *)
              echo "::warning::twist=${TWIST:-none} names no leg here." \
                   "These legs cannot see it: wrong-path and" \
                   "no-digest-check are Windows scenarios (S4/S6," \
                   "windows-installer.yml), raw-fingerprint is S8" \
                   "(bundle-fingerprint.yml). Nothing here should" \
                   "change colour."
              ;;
          esac

      # The leg builds, installs and upgrades between its own wheels,
      # so the bug it was dispatched with is inside the build it tests.
      - name: Run the auto-update leg
        env:
          LEG: ${{ matrix.leg }}
          PORT: ${{ matrix.port }}
        run: |
          # An empty PORT would fall back to the script's default — the
          # one port another leg on this machine already holds, and the
          # collision would then be blamed on the app.
          if [ -z "$PORT" ]; then
            echo "::error::leg $LEG has no PORT — the matrix include" \
                 "list and the leg list disagree"
            exit 1
          fi
          echo "leg $LEG on port $PORT"
          LEG="$LEG" PORT="$PORT" bash tests/releases/test_auto_update.sh
  # The release gate's Unix leg, on the one path that can run it today.
  # `pip-upgrade-gate.yml` is what gates a release, and a workflow file
  # that exists only on a branch cannot be dispatched — GitHub answers
  # HTTP 404 until the file is on the default branch — so without this
  # job the gate's legs would merge as code nobody has executed
  # anywhere. Same script, same inputs, same legs; only the caller
  # differs. `rehearse_gate` is false on every PR and every release, so
  # this job does not exist for either.
  gate-rehearsal:
    name: gate rehearsal (published release -> candidate, pip path)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.rehearse_gate == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      VIBE_SELLER_TELEMETRY: '0'
      GATE_FORCE: ${{ github.event.inputs.gate_force }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install lsof
        if: runner.os == 'Linux'
        run: sudo apt-get install -y lsof

      - name: The gate hop
        env:
          PREV_INPUT: ${{ github.event.inputs.prev_version }}
        run: |
          set -uo pipefail
          prev="$PREV_INPUT"
          if [ -z "$prev" ]; then
            prev=$(python3 - <<'PY'
          import json, urllib.request
          print(json.load(urllib.request.urlopen(
              'https://pypi.org/pypi/vibe-seller/json', timeout=30))['info']['version'])
          PY
          )
          fi
          echo "s9: the published $prev -> this checkout's build (GATE_FORCE=${GATE_FORCE:-false})"
          LEG=s9 PORT=7931 PREV_V="$prev" bash tests/releases/test_auto_update.sh
