name: Windows Installer

# Builds the native Windows installer (VibeSeller-Setup.exe) on a
# GitHub-hosted windows-latest runner — the only place this can be
# built/validated, since wheels are win_amd64, python-build-standalone
# is per-OS, and Inno Setup compiles on Windows. Then silently installs
# the built package and runs the SAME smoke + light agent e2e the
# release pipeline runs on Linux, proving the server works on Windows.
# See installer/windows/README.md.

on:
  pull_request:
    branches: [main]
    paths:
      - 'installer/windows/**'
      - '.github/workflows/windows-installer.yml'
      - '.github/workflows/pip-upgrade-gate.yml'
      - '.github/workflows/bundle-fingerprint.yml'
      - 'pyproject.toml'
      # Every module that decides what is offered, which path applies
      # it, when it may restart the machine, and what it reports: the
      # fingerprint that chooses pip-vs-installer lives in app/bundle.py
      # and the choice itself in app/auto_update.py, and a change to
      # either can silently move every client onto the ~700 MB path.
      - 'app/**'
      - 'app/bundle_pins.json'
      - 'app/auto_update.py'
      - 'app/pip_update.py'
      - 'app/apply_launch.py'
      - 'app/pip_apply_helper.py'
      - 'app/update_idle.py'
      # The rule that a release this machine already rolled back is
      # never applied by itself again — it decides WHETHER an apply
      # happens, exactly like the idle gate beside it.
      - 'app/update_refusal.py'
      # What an apply actually runs on macOS/Linux: the exact-version
      # install and the receipt repair. A change here moves the apply
      # path without touching a single file above it.
      - 'app/uv_tool.py'
      - 'app/update_events.py'
      - 'app/windows_update.py'
      - 'app/upgrade_restart.py'
      - 'app/update_check.py'
      - 'app/bundle.py'
      - 'app/release_channel.py'
      - 'app/cli.py'
      - 'app/main.py'
      - 'app/routers/system.py'
      - 'app/scheduler/task_queue.py'
      - 'frontend/**'
      - 'tests/releases/**'
      # What an install is made of, and what the bundle fingerprint
      # hashes — either can change the path a release takes.
      - 'uv.lock'
      - 'scripts/bundle_fingerprint.py'
      # The install check drives the shipped recovery wrapper.
      - 'scripts/reset_auth.bat'
      - 'scripts/reset_auth.sh'
  workflow_dispatch:
    inputs:
      app_version:
        description: 'Installer version string'
        required: false
        default: '0.0.0'
      twist:
        description: >-
          Build and install from a checkout with one named bug injected
          (tests/releases/twist.py --list): wrong-path, no-rollback,
          ignore-idle, no-digest-check, raw-fingerprint, dev-updates.
          'none' builds the code as it is.
        required: false
        default: 'none'
        type: string
      rehearse_gate:
        description: >-
          Also run the RELEASE GATE's Windows leg (previous published
          release -> this commit's wheel, pip path) in this dispatch.
          It is the same tests/releases/win_gate_leg.ps1 that
          pip-upgrade-gate.yml runs; that workflow cannot be dispatched
          while it exists only on a branch, so this is the one path on
          which the gate's Windows leg can be shown running before it
          ships.
        required: false
        default: false
        type: boolean
      gate_force:
        description: >-
          With rehearse_gate: fail on the gate's skip conditions instead
          of skipping, so the leg is shown capable of going red.
        required: false
        default: false
        type: boolean
      prev_version:
        description: 'Release to upgrade FROM (empty = newest stable on PyPI)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # The agent e2e below spends provider credits, so on PRs the build
  # waits for a human to approve the `e2e` environment (same gate as
  # ci.yml). Manual workflow_dispatch runs skip it.
  e2e-approval:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: e2e
    steps:
      - run: echo "e2e approved"

  # Per-PR validation: build the installer, install it, smoke + agent e2e.
  # (The heavy in-place upgrade test lives in windows-upgrade.yml and
  # runs on release only — kept separate so it's not a skipped PR check.)
  build:
    needs: e2e-approval
    if: >-
      !cancelled() &&
      (needs.e2e-approval.result == 'success' ||
       needs.e2e-approval.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # A dispatch input, never pasted into a command line: the steps
      # read it as $env:TWIST. 'none' (and any PR run, where there is no
      # input at all) builds the code exactly as it is.
      TWIST: ${{ github.event.inputs.twist }}

    steps:
      - uses: actions/checkout@v4

      # BEFORE the installer is compiled: the bundle fingerprint goes
      # INTO the installer, and every wheel in it carries the twist. A
      # leg that is supposed to fail on a bug has to be installed from
      # a build that has it.
      - name: Inject the named bug (no-op when twist=none)
        if: env.TWIST != 'none' && env.TWIST != ''
        run: python tests/releases/twist.py "$env:TWIST"
        shell: pwsh

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          # Give every build a unique, monotonic version. CI does a
          # shallow checkout, so setuptools_scm can't derive one and every
          # build ends up 0.0.1.dev1 — which the UI shows identically for
          # all of them and which lets pip/uv treat different builds as the
          # same package. Pin it explicitly, like release.yml does.
          # The shape is 99.0.<run_number> — a PLAIN version, not a dev
          # build: the channel rules make dev installs invisible to
          # app/auto_update.py (by design), and the "In-app auto-update"
          # step below must exercise the shipped updater on an install
          # shaped like a release. 99.x sorts above every real release,
          # so PyPI can never win a resolution against it.
          $ver = "${{ github.event.inputs.app_version }}"
          if ([string]::IsNullOrWhiteSpace($ver) -or $ver -eq "0.0.0") {
            $ver = "99.0.${{ github.run_number }}"
          }
          $env:SETUPTOOLS_SCM_PRETEND_VERSION = $ver
          .\installer\windows\build.ps1 -AppVersion $ver

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeSeller-Setup
          path: installer/windows/out/VibeSeller-Setup.exe
          if-no-files-found: error
          retention-days: 14

      # --- Verify the BUILT PACKAGE works on Windows -----------------
      # Reproduce the field failure: a network that can't reach
      # Playwright's CDN. Users in mainland China watched "Downloading
      # browser engine" for an hour; the installer now bundles Chromium
      # and must not need the CDN at all. Blocked AFTER the build (which
      # fetches the bundle) and BEFORE the install, for the rest of the
      # job — so any download the install or the app attempts fails, and
      # the Chromium checks below catch it.
      - name: Block the Playwright CDN (simulate an unreachable CDN)
        shell: pwsh
        run: |
          $hostsFile = "$env:SystemRoot\System32\drivers\etc\hosts"
          $names = 'cdn.playwright.dev',
                   'playwright.download.prss.microsoft.com',
                   'playwright.azureedge.net',
                   'playwright-akamai.azureedge.net',
                   'playwright-verizon.azureedge.net'
          Add-Content -Path $hostsFile -Value ($names | ForEach-Object { "0.0.0.0 $_" })
          ipconfig /flushdns | Out-Null
          foreach ($n in $names) {
            curl.exe -s -o NUL --max-time 10 "https://$n/"
            if ($LASTEXITCODE -eq 0) { throw "$n is still reachable — the block did not take" }
          }
          Write-Host "Blocked: $($names -join ', ')"
          # The runner ends a pwsh step with the LAST native exit code —
          # here the curl that was meant to fail.
          exit 0

      - name: Silent-install the built package
        shell: pwsh
        run: |
          $exe = "installer\windows\out\VibeSeller-Setup.exe"
          # Inno silent flags; post-install [Run] builds the venv +
          # installs wheels + playwright. The tray launch is skipifsilent.
          # Wait for the INSTALLER only: `-Wait` waits for the whole process
          # tree, and a silent upgrade over a running app relaunches the
          # tray + server as its children (they never exit). Setup.exe
          # itself waits for its Setup.tmp worker.
          $p = Start-Process -FilePath $exe -PassThru `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS'
          $null = $p.Handle  # cache it, or ExitCode reads $null after exit
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
          $install = "$env:LOCALAPPDATA\Programs\VibeSeller"
          if (-not (Test-Path "$install\.venv\Scripts\vibe-seller.exe")) {
            throw "vibe-seller.exe not found under $install after install"
          }
          echo "VS_INSTALL=$install" >> $env:GITHUB_ENV
          # The login shortcut must exist after the silent install —
          # it is what start-at-login (tray menu, Task Manager,
          # Settings) toggles via the StartupApproved flag. /NOICONS
          # only skips {group}\ [Icons] entries; {userstartup} is
          # created (Inno's ShouldProcessIconEntry), so this asserts
          # the real per-user behaviour.
          $lnk = Join-Path ([Environment]::GetFolderPath('Startup')) 'Vibe Seller.lnk'
          if (-not (Test-Path -LiteralPath $lnk)) { throw "installer created no login shortcut: $lnk" }
          Write-Host "OK: login shortcut $lnk"

      - name: Verify the bundled Chromium (installed offline, launches)
        shell: pwsh
        run: |
          $install = $env:VS_INSTALL
          $browsers = "$env:LOCALAPPDATA\ms-playwright"
          # 1. Complete. With the CDN blocked AND a dead download host,
          #    `playwright install` can only succeed if every piece the
          #    INSTALLED Playwright wants is already on disk.
          $env:PLAYWRIGHT_DOWNLOAD_HOST = 'http://127.0.0.1:9'
          & "$install\.venv\Scripts\playwright.exe" install chromium
          if ($LASTEXITCODE -ne 0) {
            throw "bundled browsers incomplete: playwright wanted to download"
          }
          Remove-Item Env:PLAYWRIGHT_DOWNLOAD_HOST
          # 2. Registered. The installer's own `playwright install` wrote a
          #    .links entry for THIS venv; without it another Playwright's
          #    `install` garbage-collects our browsers as unreferenced.
          $pkg = "$install\.venv\Lib\site-packages\playwright\driver\package"
          $linked = Get-ChildItem "$browsers\.links" -File -ErrorAction SilentlyContinue |
            Where-Object { (Get-Content $_.FullName -Raw).Trim() -eq $pkg }
          if (-not $linked) { throw "no ms-playwright\.links entry for $pkg" }
          # 3. Launches, through the same launch_persistent_context call
          #    the chrome backend makes: the full Chromium (headed stores)
          #    and the headless shell (the headless toggle).
          $test = Join-Path $env:RUNNER_TEMP 'launch_bundled_chromium.py'
          Set-Content -LiteralPath $test -Encoding ascii -Value @'
          import asyncio
          import tempfile

          from playwright.async_api import async_playwright

          CASES = (
              ('chromium', {'channel': 'chromium', 'headless': True}),
              ('headless-shell', {'headless': True}),
          )


          async def main():
              async with async_playwright() as pw:
                  print('executable:', pw.chromium.executable_path)
                  for label, kw in CASES:
                      ctx = await pw.chromium.launch_persistent_context(
                          user_data_dir=tempfile.mkdtemp(), **kw)
                      page = await ctx.new_page()
                      ua = await page.evaluate('navigator.userAgent')
                      print('OK', label, ua)
                      await ctx.close()


          asyncio.run(main())
          '@
          & "$install\.venv\Scripts\python.exe" $test
          if ($LASTEXITCODE -ne 0) { throw "bundled Chromium failed to launch" }

      - name: Start server (background)
        shell: pwsh
        run: |
          $install = $env:VS_INSTALL
          # Strip the runner's pre-installed Git for Windows from PATH so
          # the daemon — and the agent it spawns, which inherits THIS
          # step's env — can only use the BUNDLED toolchain. Without this,
          # Claude Code finds the runner's C:\Program Files\Git bash and CI
          # is a false green that never exercises the shipped bundle a real
          # user gets.
          $clean = ($env:PATH -split ';' | Where-Object { $_ -and $_ -notlike 'C:\Program Files\Git\*' -and $_ -ne 'C:\Program Files\Git' }) -join ';'
          # Replicate the tray's PATH augmentation so the agent subprocess
          # finds the bundled claude + git/bash/curl/perl.
          $env:PATH = "$install\.venv\Scripts;$install;$install\claude;" +
                      "$install\git\cmd;$install\git\bin;" +
                      "$install\git\usr\bin;$install\git\mingw64\bin;$clean"
          # Pin Claude Code's Bash tool at the bundled bash.exe (it needs a
          # file literally named bash.exe, else falls back to PowerShell —
          # which can't run the extensionless bash browser-use wrapper).
          $env:CLAUDE_CODE_GIT_BASH_PATH = "$install\git\bin\bash.exe"
          # Reuse the bundled interpreter for the agent venv (the tray
          # sets this on a real install).
          $env:VIBE_SELLER_BUNDLED_PYTHON = "$install\python\python.exe"
          # AGENT_DEBUG makes backend_7777.log capture the agent's
          # thinking + tool calls, so the uploaded log artifact is
          # actually useful when the agent e2e fails or hangs.
          $env:AGENT_DEBUG = '1'
          & "$install\.venv\Scripts\vibe-seller.exe" start --port 7777

      - name: Smoke test (verify_install.sh — health + store/profile API)
        shell: bash
        run: |
          export PATH="$VS_INSTALL/.venv/Scripts:$PATH"
          # Empty version arg → skip the version-match check (this is a
          # PR build, not a published release).
          bash tests/releases/verify_install.sh ""

      - name: Verify the installed app can recover a forgotten password
        shell: pwsh
        run: |
          # `vibe-seller reset-auth` is how an operator gets back in when
          # the admin password is lost. It has to work in the INSTALLED
          # package (not just the checkout), so run the shipped wrapper
          # — it finds the installed app — and then log in with the
          # password it just set.
          #
          # A reset MUTATES the database it points at, so this runs
          # against its own throwaway install (VIBE_HOME under
          # RUNNER_TEMP, second server on port 7793), not the shared
          # ~/.vibe-seller the later agent e2e logs into with the seeded
          # admin/admin. Resetting the shared one here left that e2e
          # answering 401 at every login attempt.
          $resetHome = Join-Path $env:RUNNER_TEMP 'vs-reset-home'
          if (Test-Path $resetHome) {
            Remove-Item -Recurse -Force $resetHome
          }
          $env:VIBE_HOME = $resetHome
          $exe = "$env:VS_INSTALL\.venv\Scripts\vibe-seller.exe"
          & $exe start --port 7793
          if ($LASTEXITCODE -ne 0) { throw "second server failed to start" }
          # A cold first boot is what creates the database and seeds the
          # default admin — the state recovery is meant for. 150s: the
          # cold boot runs the skills+knowledge sync, which can cross a
          # minute on a contended runner.
          $healthy = $false
          for ($i = 0; $i -lt 150; $i++) {
            try {
              Invoke-RestMethod -Uri 'http://127.0.0.1:7793/api/health' `
                -TimeoutSec 2 | Out-Null
              $healthy = $true
              break
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $healthy) { throw 'reset-auth server never became healthy' }

          .\scripts\reset_auth.bat status
          if ($LASTEXITCODE -ne 0) { throw "reset-auth status failed" }
          .\scripts\reset_auth.bat password --user admin --rename --password ci-secret
          if ($LASTEXITCODE -ne 0) { throw "reset-auth password failed" }
          $body = @{identifier = 'admin'; password = 'ci-secret'} |
            ConvertTo-Json -Compress
          try {
            Invoke-RestMethod -Uri 'http://127.0.0.1:7793/api/auth/login' `
              -Method Post -ContentType 'application/json' -Body $body |
              Out-Null
          } catch {
            throw "login with the reset password failed: $_"
          }
          # The server must still be serving after the reset.
          Invoke-RestMethod -Uri 'http://127.0.0.1:7793/api/health' | Out-Null
          Write-Host 'OK: the installed app can reset a forgotten password'
          & $exe stop --port 7793
          Remove-Item -Recurse -Force $resetHome

      - name: Verify bundled bash runs the extensionless wrapper shape
        shell: pwsh
        run: |
          # The per-store browser-use wrapper is an extensionless bash
          # script — the exact shape that fails under Claude Code's
          # PowerShell fallback on a machine without bash.exe (the user's
          # "Select an app to open 'browser-use'" dialog). Prove the
          # BUNDLED bash resolves + executes one by bare name off PATH,
          # exactly as the agent's Bash tool does. No LLM, so this guards
          # every PR (incl. forks where the agent e2e is gated off), and a
          # regression to a bundle without bash.exe fails right here.
          $bash = "$env:VS_INSTALL\git\bin\bash.exe"
          if (-not (Test-Path $bash)) { throw "bundled bash.exe missing: $bash" }
          $prog = 'set -e; d="$(mktemp -d)"; printf ''#!/usr/bin/env bash\necho VS_WRAPPER_OK\n'' > "$d/browser-use"; chmod +x "$d/browser-use"; export PATH="$d:$PATH"; browser-use'
          $out = & $bash --login -c $prog
          if ("$out" -notmatch 'VS_WRAPPER_OK') {
            throw "bundled bash could not execute an extensionless wrapper (out: $out)"
          }
          Write-Host "OK: bundled bash executes extensionless shebang wrappers"

      - name: Tray dialog + start-at-login tests (dialog/clipboard, registry, shortcuts)
        shell: pwsh
        run: |
          # Verifies the fix for the unresponsive dialog + Copy-to-clipboard
          # on a real desktop session — no manual clicking. Uses the
          # bundled python's tkinter; dialogs.py has no pystray dep.
          $py = "$env:VS_INSTALL\.venv\Scripts\python.exe"
          # pytest-asyncio is needed because the repo's tests/conftest.py
          # imports it at collection time (even for this sync test).
          & "$env:VS_INSTALL\uv.exe" pip install --python $py `
            pytest pytest-asyncio
          # test_tray_autostart.py additionally round-trips the
          # StartupApproved flag (scratch HKCU key) and re-creates the
          # login shortcut through WScript.Shell — real Windows only,
          # so this runner is where its (c) tests actually execute.
          & $py -m pytest tests\unit\test_tray_dialog.py `
            tests\unit\test_tray_autostart.py -v

      - name: Install pytest deps into the bundled venv (for agent e2e)
        shell: pwsh
        run: |
          $py = "$env:VS_INSTALL\.venv\Scripts\python.exe"
          & "$env:VS_INSTALL\uv.exe" pip install --python $py `
            pytest pytest-asyncio httpx pytest-playwright

      - name: Light agent e2e against the installed daemon
        shell: pwsh
        env:
          E2E_BASE_URL: http://127.0.0.1:7777
          # One provider (single worker), a repo variable like the CI map.
          E2E_PROVIDER_MAP: ${{ vars.E2E_SMOKE_PROVIDER }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_BASE_URL: ${{ secrets.MINIMAX_BASE_URL }}
          MINIMAX_MODEL: ${{ secrets.MINIMAX_MODEL }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_BASE_URL: ${{ secrets.GLM_BASE_URL }}
          GLM_MODEL: ${{ secrets.GLM_MODEL }}
          QWEN_TOKEN_API_KEY: ${{ secrets.QWEN_TOKEN_API_KEY }}
          QWEN_TOKEN_BASE_URL: ${{ secrets.QWEN_TOKEN_BASE_URL }}
          QWEN_TOKEN_MODEL: ${{ secrets.QWEN_TOKEN_MODEL }}
          API_TIMEOUT_MS: '3000000'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          VIBE_SELLER_TELEMETRY: '0'
        run: |
          if (-not $env:E2E_PROVIDER_MAP) {
            Write-Output "::error::repo variable E2E_SMOKE_PROVIDER is not set"
            exit 1
          }
          $install = $env:VS_INSTALL
          # NOTE: the agent runs under the daemon started in the "Start
          # server" step and inherits THAT step's env (bundled bash, no
          # runner git). This PATH only affects the pytest client here.
          $env:PATH = "$install\.venv\Scripts;$install;$install\claude;" +
                      "$install\git\cmd;$install\git\bin;" +
                      "$install\git\usr\bin;$install\git\mingw64\bin;$env:PATH"
          & "$install\.venv\Scripts\python.exe" -m pytest `
            tests/e2e/test_llm_browser.py::TestLLMBrowserAPI::test_agent_reads_homepage `
            --e2e -v --log-cli-level=INFO

      - name: Verify the agent venv reused the bundled Python
        shell: pwsh
        run: |
          # The e2e task created ~/.vibe-seller/.venv. Its pyvenv.cfg must
          # point back at the bundled interpreter — proving `uv venv`
          # reused it instead of downloading a second Python.
          $cfg = "$env:USERPROFILE\.vibe-seller\.venv\pyvenv.cfg"
          if (-not (Test-Path $cfg)) {
            throw "agent venv not created — cannot verify Python reuse"
          }
          $text = Get-Content $cfg -Raw
          Write-Host $text
          $bundled = "$env:VS_INSTALL\python"
          if ($text -notmatch [regex]::Escape($bundled)) {
            throw "agent venv did NOT reuse the bundled Python (no '$bundled' in pyvenv.cfg)"
          }
          Write-Host "OK: agent venv reused the bundled Python ($bundled)"

      - name: Stop server + stage logs
        if: always()
        shell: pwsh
        run: |
          & "$env:VS_INSTALL\.venv\Scripts\vibe-seller.exe" stop --port 7777
          $log = "$env:USERPROFILE\.vibe-seller\logs\backend_7777.log"
          if (Test-Path $log) { Get-Content -Tail 40 $log }
          # Stage logs under the workspace so a failing/hanging agent
          # e2e is debuggable from the artifact, not just this tail.
          $dst = "$env:GITHUB_WORKSPACE\ci-logs"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $logs = "$env:USERPROFILE\.vibe-seller\logs"
          if (Test-Path $logs) { Copy-Item -Recurse -Force $logs "$dst\logs" }

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-server-logs
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14

  # Regression guard: a user who uninstalls WITHOUT quitting the tray
  # leaves a running pythonw.exe that locks .venv\Scripts\pythonw.exe, so
  # the uninstaller can't fully remove .venv; the next install's `uv venv`
  # then refuses the partial dir and the browser-engine step dies with
  # "playwright.exe ... cannot find the file specified". Reproduce it
  # deterministically and assert the venv rebuilds. No LLM/secrets, so it
  # guards every PR (incl. forks).
  uninstall-reinstall:
    name: Uninstall (python running) -> reinstall
    runs-on: windows-latest
    needs: build
    # Explicit: the implicit success() also requires every ANCESTOR to
    # have run, so a workflow_dispatch (e2e-approval skipped) silently
    # skipped this job even when the build passed.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    timeout-minutes: 30
    steps:
      - name: Download the built installer
        uses: actions/download-artifact@v4
        with:
          name: VibeSeller-Setup
          path: installer-dl

      - name: Install
        shell: pwsh
        run: |
          $browsers = "$env:LOCALAPPDATA\ms-playwright"
          $before = @(Get-ChildItem $browsers -Directory -ErrorAction SilentlyContinue).Name
          # Wait for the INSTALLER only: `-Wait` waits for the whole process
          # tree, and a silent upgrade over a running app relaunches the
          # tray + server as its children (they never exit). Setup.exe
          # itself waits for its Setup.tmp worker.
          $p = Start-Process -FilePath "installer-dl\VibeSeller-Setup.exe" -PassThru `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS'
          $null = $p.Handle  # cache it, or ExitCode reads $null after exit
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { throw "install exited $($p.ExitCode)" }
          $install = "$env:LOCALAPPDATA\Programs\VibeSeller"
          if (-not (Test-Path "$install\.venv\Scripts\playwright.exe")) {
            throw "first install did not build the venv"
          }
          echo "VS_INSTALL=$install" >> $env:GITHUB_ENV
          # The browser dirs THIS install added (the runner image may carry
          # other Playwright browsers; those are not ours to remove).
          $added = @(Get-ChildItem $browsers -Directory).Name |
            Where-Object { $_ -ne '.links' -and $before -notcontains $_ }
          if (-not $added) { throw "install added no browser dirs under $browsers" }
          Write-Host "bundled browser dirs: $($added -join ',')"
          echo "VS_BUNDLED_BROWSERS=$($added -join ',')" >> $env:GITHUB_ENV
          # Launches a Chromium like one the chrome backend opened: it
          # outlives the server the installer kills (Windows doesn't take
          # children down with the parent). -From picks the ms-playwright
          # dir (default: the bundled chromium-<rev>); -UserDataDir under
          # ...\browser_profiles\ makes it a store's. Prints its pid.
          Set-Content -LiteralPath "$env:RUNNER_TEMP\hold_chromium.ps1" -Encoding ascii -Value @'
          param([string]$From = '', [string]$UserDataDir = '')
          $browsers = "$env:LOCALAPPDATA\ms-playwright"
          if (-not $From) {
            $From = $env:VS_BUNDLED_BROWSERS -split ',' |
              Where-Object { $_ -like 'chromium-*' } | Select-Object -First 1
          }
          $chrome = Get-ChildItem (Join-Path $browsers $From) -Recurse -Filter chrome.exe |
            Select-Object -First 1
          if (-not $chrome) { throw "no chrome.exe under $browsers\$From" }
          if (-not $UserDataDir) {
            $UserDataDir = Join-Path $env:RUNNER_TEMP ("held-chromium-" + [guid]::NewGuid())
          }
          $p = Start-Process -FilePath $chrome.FullName -PassThru -ArgumentList `
            '--headless=new', "--user-data-dir=$UserDataDir", '--no-first-run', 'about:blank'
          Start-Sleep 5
          if ($p.HasExited) { throw "precondition: held Chromium exited immediately ($($chrome.FullName))" }
          Write-Host "holding Chromium pid=$($p.Id) from $From (profile $UserDataDir)"
          $p.Id
          '@

      - name: Upgrade in place while Chromium runs (old revision + bundled)
        shell: pwsh
        run: |
          # PrepareToInstall must stop two kinds of Chromium the killed
          # server leaves behind:
          #  - a store's, from an OLD revision: an upgrade that bumps
          #    Playwright installs a new revision dir, and the orphan keeps
          #    its store's profile locked; Chrome then refuses that store
          #    until a reboot. Matched by ownership (browser_profiles).
          #  - anything running from the bundled revision: it locks files
          #    [Files] overwrites; a silent install would hit "file in use"
          #    and abort (a GUI one asks the user to close it).
          $browsers = "$env:LOCALAPPDATA\ms-playwright"
          $bundled = $env:VS_BUNDLED_BROWSERS -split ',' |
            Where-Object { $_ -like 'chromium-*' } | Select-Object -First 1
          Copy-Item -Recurse "$browsers\$bundled" "$browsers\chromium-1000"
          $storeProfile = "$env:USERPROFILE\.vibe-seller\browser_profiles\ci-old-revision"
          New-Item -ItemType Directory -Force $storeProfile | Out-Null
          $heldOld = & "$env:RUNNER_TEMP\hold_chromium.ps1" -From chromium-1000 -UserDataDir $storeProfile
          $heldNew = & "$env:RUNNER_TEMP\hold_chromium.ps1"
          # Wait for the INSTALLER only: `-Wait` waits for the whole process
          # tree, and a silent upgrade over a running app relaunches the
          # tray + server as its children (they never exit). Setup.exe
          # itself waits for its Setup.tmp worker.
          $p = Start-Process -FilePath "installer-dl\VibeSeller-Setup.exe" -PassThru `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS'
          $null = $p.Handle  # cache it, or ExitCode reads $null after exit
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) {
            throw "in-place reinstall over a running Chromium exited $($p.ExitCode)"
          }
          foreach ($h in @($heldOld, $heldNew)) {
            if (Get-Process -Id $h -ErrorAction SilentlyContinue) {
              throw "held Chromium pid=$h survived the reinstall"
            }
          }
          $left = Get-CimInstance Win32_Process | Where-Object {
            $_.ExecutablePath -like "$browsers\*" }
          if ($left) { throw "Chromium still running from ms-playwright: $($left.ProcessId -join ',')" }
          Remove-Item -Recurse -Force "$browsers\chromium-1000" -ErrorAction SilentlyContinue
          # The overwritten bundle is still complete (nothing to download).
          $env:PLAYWRIGHT_DOWNLOAD_HOST = 'http://127.0.0.1:9'
          & "$env:VS_INSTALL\.venv\Scripts\playwright.exe" install chromium
          if ($LASTEXITCODE -ne 0) { throw "bundle incomplete after in-place reinstall" }
          Write-Host "OK: upgrade over running Chromium (old revision + bundled)"

      - name: Hold a venv python open (locks .venv, like the tray)
        shell: pwsh
        run: |
          $install = $env:VS_INSTALL
          $py = "$install\.venv\Scripts\python.exe"
          # Mimic the running tray at uninstall time: keep a python process
          # from the install alive with a NATIVE venv extension loaded, so a
          # file *inside* .venv stays locked (the real tray does this via
          # pystray/PIL). A bare `time.sleep` touches no .venv file and would
          # not reproduce the partial-.venv bug; importing Pillow's C ext
          # locks .venv\Lib\site-packages\PIL\_imaging*.pyd.
          #
          # First prove the interpreter runs and PIL imports SYNCHRONOUSLY,
          # so a broken venv/holder fails here with a real error instead of
          # silently as "no process". The dump below also confirms the
          # long-lived process's real name/path (python.exe under
          # .venv\Scripts) rather than assuming it.
          & $py -c "import sys; print('sys.executable=', sys.executable); print('sys.prefix=', sys.prefix)"
          & $py -c "from PIL import Image, _imaging; print('PIL _imaging at', _imaging.__file__)"
          if ($LASTEXITCODE -ne 0) { throw "venv python cannot import Pillow C ext (exit $LASTEXITCODE)" }

          # Launch the long-lived holder from a SCRIPT FILE, not `-c`:
          # Start-Process mangles a `-c` string full of spaces/commas/
          # parens, so python got a broken program and exited instantly
          # (observed: launcher HasExited=True, zero python left). A file
          # path has no such quoting hazard.
          $holder = Join-Path $env:RUNNER_TEMP 'hold_venv.py'
          Set-Content -LiteralPath $holder -Encoding ascii -Value @(
            'from PIL import Image, _imaging',
            'import time',
            'time.sleep(900)')
          $proc = Start-Process -FilePath $py -ArgumentList $holder -PassThru
          Start-Sleep 6
          Write-Host "launcher pid=$($proc.Id) HasExited=$($proc.HasExited)"
          Write-Host "--- python-family processes now running ---"
          Get-CimInstance Win32_Process | Where-Object {
            $_.Name -eq 'python.exe' -or $_.Name -eq 'pythonw.exe' } |
            ForEach-Object { Write-Host "  $($_.Name) pid=$($_.ProcessId) path=$($_.ExecutablePath)" }

          # The uninstall fix kills python/pythonw whose ExecutablePath is
          # under {app}; the precondition asserts exactly that population is
          # non-empty (match by the real install path, any subdir).
          $running = Get-CimInstance Win32_Process | Where-Object {
            ($_.Name -eq 'python.exe' -or $_.Name -eq 'pythonw.exe') -and
            $_.ExecutablePath -and $_.ExecutablePath.StartsWith($install, [System.StringComparison]::OrdinalIgnoreCase) }
          if (-not $running) { throw "precondition failed: no venv python holding the lock" }
          Write-Host "holding python pid(s): $($running.ProcessId -join ',')"
          # And a Chromium from the bundle, which the uninstaller must stop too.
          $held = & "$env:RUNNER_TEMP\hold_chromium.ps1"
          echo "VS_HELD_CHROMIUM=$held" >> $env:GITHUB_ENV

      - name: Uninstall WHILE the pythonw is running
        shell: pwsh
        run: |
          $u = "$env:VS_INSTALL\unins000.exe"
          if (-not (Test-Path $u)) { throw "uninstaller missing: $u" }
          if (-not (Get-Process -Id $env:VS_HELD_CHROMIUM -ErrorAction SilentlyContinue)) {
            throw "precondition: the held Chromium died before the uninstall"
          }
          $p = Start-Process -FilePath $u -Wait -PassThru `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          Write-Host "uninstall exit=$($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "uninstall exited $($p.ExitCode) — scenario not exercised" }
          Start-Sleep 3
          # The uninstall fix kills venv python/pythonw, so nothing should
          # linger holding a lock on .venv.
          $left = Get-CimInstance Win32_Process | Where-Object {
            ($_.Name -eq 'pythonw.exe' -or $_.Name -eq 'python.exe') -and
            $_.ExecutablePath -like '*\VibeSeller\*' }
          if ($left) { throw "venv python still running after uninstall: $($left.ProcessId -join ',')" }
          $browsers = "$env:LOCALAPPDATA\ms-playwright"
          $chromeLeft = Get-CimInstance Win32_Process | Where-Object {
            $_.ExecutablePath -like "$browsers\*" }
          if ($chromeLeft) { throw "bundled Chromium still running after uninstall: $($chromeLeft.ProcessId -join ',')" }
          # The bundled browser dirs go with the app (~700 MB).
          $kept = $env:VS_BUNDLED_BROWSERS -split ',' |
            Where-Object { Test-Path (Join-Path $browsers $_) }
          if ($kept) { throw "bundled browsers left after uninstall: $($kept -join ', ')" }

      - name: Reinstall
        shell: pwsh
        run: |
          # Wait for the INSTALLER only: `-Wait` waits for the whole process
          # tree, and a silent upgrade over a running app relaunches the
          # tray + server as its children (they never exit). Setup.exe
          # itself waits for its Setup.tmp worker.
          $p = Start-Process -FilePath "installer-dl\VibeSeller-Setup.exe" -PassThru `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS'
          $null = $p.Handle  # cache it, or ExitCode reads $null after exit
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { throw "reinstall exited $($p.ExitCode)" }

      - name: Assert the venv rebuilt + server healthy
        shell: pwsh
        run: |
          $install = $env:VS_INSTALL
          foreach ($f in @('.venv\Scripts\python.exe','.venv\Scripts\playwright.exe','.venv\Scripts\vibe-seller.exe')) {
            if (-not (Test-Path "$install\$f")) { throw "missing after reinstall: $f (venv rebuild failed)" }
          }
          # The reinstall laid the bundle down again, complete.
          $env:PLAYWRIGHT_DOWNLOAD_HOST = 'http://127.0.0.1:9'
          & "$install\.venv\Scripts\playwright.exe" install chromium
          if ($LASTEXITCODE -ne 0) { throw "bundle incomplete after uninstall -> reinstall" }
          Remove-Item Env:PLAYWRIGHT_DOWNLOAD_HOST
          $env:PATH = "$install\.venv\Scripts;$install;$install\git\bin;$install\git\usr\bin;$env:PATH"
          $env:CLAUDE_CODE_GIT_BASH_PATH = "$install\git\bin\bash.exe"
          $env:VIBE_SELLER_BUNDLED_PYTHON = "$install\python\python.exe"
          & "$install\.venv\Scripts\vibe-seller.exe" start --port 7777
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { if ((Invoke-RestMethod http://127.0.0.1:7777/api/version -TimeoutSec 3).version) { $ok = $true; break } } catch { }
            Start-Sleep 2
          }
          & "$install\.venv\Scripts\vibe-seller.exe" stop --port 7777
          if (-not $ok) { throw "reinstalled server never became healthy" }
          Write-Host "OK: uninstall (python running) -> reinstall rebuilds the venv"

  # ── The Windows update paths, one leg per scenario ────────────────
  # tests/releases/README.md is the map: which leg proves what, and
  # which twist turns it red.
  #
  # The install under test is the installer the `build` job just
  # compiled, silently installed for real — so the layout is what a user
  # has: {app}\python, {app}\uv.exe, {app}\wheels, {app}\bundle.json
  # and unins000.exe next to the venv. That layout is the only thing
  # that makes app/auto_update.py offer the pip path at all, and a
  # source checkout cannot fake it.
  #
  # Nothing here publishes, and nothing here reads GitHub's release API:
  # the release an install is offered is a plain local JSON in the
  # GitHub shape whose assets are files on the runner. The two update
  # paths differ ONLY by the bundle fingerprint, so the legs differ ONLY
  # by the bundle.json asset beside that release — same installer, same
  # wheels, everything else equal.
  #
  #   s3   same bundle            -> pip path, applied BY ITSELF
  #   s4   a pin differs          -> installer path, waits for the click
  #   s5   a package that dies    -> OLD comes back; never left dark
  #   s5b  OLD -> v2 -> broken v3 -> back on v2, not on OLD
  #   s6   tampered installer     -> refused, nothing launched
  #
  # This was one step inside `build` (#244's installer path). It is a
  # matrix now because the pip path needs scenarios the installer path
  # never had, and `build` is already at its timeout with the agent e2e.
  # It still needs `build` for the installer artifact, but runs even when
  # that job's e2e steps failed: the artifact is uploaded long before
  # them, and a flaky provider must not hide whether the updater works.
  auto-update:
    name: in-app update leg ${{ matrix.leg }}
    runs-on: windows-latest
    timeout-minutes: 60
    needs: build
    if: >-
      always() &&
      (needs.build.result == 'success' ||
       needs.build.result == 'failure')
    strategy:
      # One red leg must not hide whether the other four still work.
      fail-fast: false
      matrix:
        leg: [s3, s4, s5, s5b, s5c, s6]
    env:
      # Only literals and allowed contexts here: the `runner` context is
      # NOT available at job level (GitHub rejects the whole file — see
      # the scratch-path step below), and a job-level value would also be
      # identical for every matrix leg.
      #
      # These three still reach the daemon AND the detached apply helper
      # it spawns, because app/apply_launch.py copies the environment
      # into the helper's argument document.
      VIBE_SELLER_AUTO_UPDATE: '1'
      VIBE_SELLER_PORT: '7794'
      VIBE_SELLER_TELEMETRY: '0'
      TWIST: ${{ github.event.inputs.twist }}
      # Higher than every real release and than the installer's own
      # 99.0.<run>, so PyPI can never win a resolution and `is_newer`
      # always sees an upgrade. Two hops for s5b.
      VS_V2: '99.9.9'
      VS_V3: '99.9.10'
    steps:
      - uses: actions/checkout@v4
        with:
          # The legs build wheels from this tree with
          # SETUPTOOLS_SCM_PRETEND_VERSION, like every other upgrade
          # job; the build backend still runs setuptools-scm.
          fetch-depth: 0

      - name: Name this leg's scratch paths
        env:
          LEG: ${{ matrix.leg }}
        shell: pwsh
        run: |
          # Each leg gets its own VIBE_HOME and its own mock release
          # document: a leg that inherited another leg's staged installer
          # or ready-clock would not be testing anything. And these are
          # here rather than in job env because the `runner` context only
          # exists inside a step — GitHub refuses to load a workflow that
          # uses it at job level, and `matrix.leg` would be the same
          # answer everywhere else anyway.
          $t = $env:RUNNER_TEMP
          "VIBE_HOME=$t\vs-$env:LEG-home"            | Out-File -Append -FilePath $env:GITHUB_ENV
          "VIBE_SELLER_RELEASES_URL=$t\vs-$env:LEG-release.json" | Out-File -Append -FilePath $env:GITHUB_ENV
          # Where the prefetch finds the target wheel. The apply itself
          # runs `uv pip install --offline`, so this only has to be true
          # for the prefetch — and if the cache did NOT get the wheel,
          # the offline dry run refuses (app/pip_update
          # .offline_apply_proven) and the update goes to the installer
          # instead, which is exactly what legs s3/s5/s5b/s5c assert
          # against by demanding path == 'pip'.
          "UV_FIND_LINKS=$t\dist"                   | Out-File -Append -FilePath $env:GITHUB_ENV
          "VS_DIST=$t\dist"                         | Out-File -Append -FilePath $env:GITHUB_ENV
          "VS_SETUP=$t\setup\VibeSeller-Setup.exe" | Out-File -Append -FilePath $env:GITHUB_ENV
          "leg $env:LEG home: $t\vs-$env:LEG-home"

      - name: Inject the named bug (no-op when twist=none)
        if: env.TWIST != 'none' && env.TWIST != ''
        env:
          TWIST: ${{ github.event.inputs.twist }}
        run: python tests/releases/twist.py "$env:TWIST"
        shell: pwsh

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Download the installer under test
        uses: actions/download-artifact@v4
        with:
          name: VibeSeller-Setup
          path: ${{ runner.temp }}\setup

      - name: Silent-install the release the legs upgrade FROM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path $env:VS_SETUP).Path
          $p = Start-Process -FilePath $exe -PassThru `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS'
          $null = $p.Handle
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
          $install = "$env:LOCALAPPDATA\Programs\VibeSeller"
          "VS_INSTALL=$install" >> $env:GITHUB_ENV
          # The three things the pip path needs from this layout, checked
          # HERE so a leg that can never take the pip path fails with a
          # reason instead of a timeout.
          foreach ($need in @(
              "$install\.venv\Scripts\vibe-seller.exe",
              "$install\bundle.json",
              "$install\uv.exe",
              "$install\python\python.exe",
              "$install\unins000.exe")) {
            if (-not (Test-Path $need)) {
              throw "the installed bundle is missing $need — the pip path cannot exist here"
            }
          }
          "installed bundle fingerprint: $((Get-Content "$install\bundle.json" -Raw | ConvertFrom-Json).fingerprint)"
          "installed app version: $((& "$install\.venv\Scripts\vibe-seller.exe" --version))"

      # OLD -> NEW with the SAME runtime bundle: a few MB of wheels into
      # the venv that is already there. Nobody clicks anything — the idle
      # tick applies it (app/auto_update.py:idle_tick) — and the bundle
      # beside the venv must come out of it untouched, because that file
      # is what every future update check compares against.
      # Turns red under: no-rollback (S5 too), ignore-idle only in the
      # other direction, and raw-fingerprint would break the CHOICE,
      # which leg s8 in bundle-fingerprint.yml owns.
      - name: Leg s3 — same bundle means the pip path, applied by itself
        if: matrix.leg == 's3'
        shell: pwsh
        run: |
          . "$env:GITHUB_WORKSPACE\tests\releases\win_leg_harness.ps1"
          Start-LegServer
          $new = $env:VS_V2
          Build-GoodWheel $new
          $bundle = BundleHash
          # The release's bundle.json asset IS the installed file: equal
          # fingerprints are the whole pip-path signal, and nothing else
          # about this release says it.
          Write-Release -Version $new -BundleAsset (BundlePath)
          $st = Wait-OnState @('ready', 'error')
          if (-not $st -or $st.state -ne 'ready') {
            Fail "never reached ready (last: $(Json $st))"
          }
          if ($st.version -ne $new) { Fail "ready for $($st.version), not $new" }
          if ($st.path -ne 'pip') {
            Fail "chose the '$($st.path)' path for a release whose bundle is identical — app/bundle.py's pip_path_applies is not answering"
          }
          if (-not $st.auto_apply) { Fail 'a pip update must be able to apply itself' }
          if ($st.popup_due) { Fail 'a ready pip update must not ask for a click' }
          $before = Server-Pid
          # No restart POST anywhere in this leg: the machine must move
          # by itself, within a couple of idle intervals.
          if (-not (Wait-OnVersion -want $new -tries 420)) {
            Fail "the idle server did not apply the pip update by itself (still $(Server-Version), state $(Json (Status)))"
          }
          if ((Server-Pid) -eq $before) {
            Fail "$new answers from the SAME process that served $script:Old — the files changed, the server did not"
          }
          if ((Get-NetTCPConnection -LocalPort $script:Port -State Listen -ErrorAction SilentlyContinue | Measure-Object).Count -ne 1) {
            Fail 'two servers answer the port: the helper started a copy beside the one the tray owns'
          }
          if ((BundleHash) -ne $bundle) {
            Fail '{app}\bundle.json was rewritten — a pip update must not touch the runtime beside the venv'
          }
          $rec = Read-Record
          if (-not $rec -or $rec.status -ne 'ok') {
            Fail "the apply left no ok record (got $(Json $rec))"
          }
          # `trigger` is the leg's own claim: an update that reached NEW
          # because a human clicked would satisfy every assertion above
          # and still not be the thing s3 is for.
          if ($rec.trigger -ne 'auto_idle') {
            Fail "the update applied with trigger '$($rec.trigger)', not auto_idle"
          }
          if ($rec.path -ne 'pip') { Fail "record path is '$($rec.path)'" }
          if (-not (Test-Path "$script:Install\.venv\Scripts\pythonw.exe")) {
            Fail 'the tray python is gone — nothing owns the server now'
          }
          if (-not (Loop { (Status).state -eq 'idle' } 60)) {
            Fail "the NEW server does not consider itself up to date: $(Json (Status))"
          }
          Write-Host "OK: s3 $script:Old -> $new over the pip path, no click, bundle.json untouched"
          Stop-LegServer

      # A release whose bundle.json names a different runtime (one pin
      # fabricated). The ~700 MB installer is the only correct answer —
      # a pip install cannot replace the Python, Git, uv, claude or
      # Chromium beside the venv. And it must WAIT: only a click may run
      # an installer.
      # Turns red under: wrong-path, which answers pip for this release.
      - name: Leg s4 — a changed pin means the installer path, and waits for the click
        if: matrix.leg == 's4'
        shell: pwsh
        run: |
          . "$env:GITHUB_WORKSPACE\tests\releases\win_leg_harness.ps1"
          Start-LegServer
          $new = $env:VS_V2
          # The wheels are NOT built here on purpose: an install that
          # could be pip-applied must not be, so if a bug did choose the
          # pip path it fails at the fingerprint, not at a missing wheel.
          $changed = New-ChangedBundle "$env:RUNNER_TEMP\bundle-changed.json"
          Write-Release -Version $new -BundleAsset $changed
          $st = Wait-OnState @('ready', 'error')
          if (-not $st -or $st.state -ne 'ready') {
            Fail "never staged the installer (last: $(Json $st))"
          }
          if ($st.path -ne 'installer') {
            Fail "chose the '$($st.path)' path although the release's bundle fingerprint differs — #244's flow is the only safe one here"
          }
          if ($st.auto_apply) { Fail 'an installer update must never apply itself' }
          if (-not $st.popup_due) {
            Fail 'an installer update is inert until clicked, so it must ask (#244)'
          }
          $staged = "$script:Updates\$new\VibeSeller-Setup.exe"
          if (-not (Test-Path $staged)) { Fail "the installer was not staged at $staged" }
          Assert-NoSelfApply $new
          # The click. This is the whole of what the installer path owes
          # a user: it runs the STAGED file, and the app comes back.
          $before = Server-Pid
          $r = Invoke-RestMethod -Method Post `
            "$($script:Base)/api/system/update/restart" -TimeoutSec 20
          if ($r.state -ne 'restarting') { Fail "restart reply: $(Json $r)" }
          if (-not (Loop { $pid2 = Server-Pid; ($pid2 -and $pid2 -ne $before -and [bool](Server-Version)) } 360)) {
            Fail "the installer never brought the app back on $($script:Port) (old pid $before)"
          }
          $log = "$script:Updates\$new\install.log"
          if (-not (Test-Path $log)) { Fail "no installer log at $log" }
          if (-not (Select-String -Path $log -Pattern 'Source:.*updates')) {
            Fail 'the installer /LOG does not account for running from the staged file'
          }
          if (-not (Select-String -Path $log -Pattern 'Relaunched the tray' -SimpleMatch)) {
            Fail 'the silent upgrade did not relaunch the tray'
          }
          # Honest limit: the asset this leg stages is the SAME installer
          # the leg installed from, so the version cannot move — only a
          # second installer build could, and that is windows-upgrade.yml
          # (real previous release -> a built NEW) and the pip path's
          # version move is leg s3 here and pip-upgrade-gate.yml between
          # two real releases. What this leg owns is the CHOICE, the
          # refusal to self-apply, and that the staged bytes are what ran.
          Write-Host "OK: s4 chose the installer path, refused to self-apply, and ran the staged file on the click ($(Server-Version), pid $(Server-Pid))"
          Stop-LegServer

      # The one failure an updater is not allowed to produce: a machine
      # with no server. The offered release installs cleanly and then
      # dies at boot, so the detached helper must put the old version
      # back and bring THAT up (app/pip_apply_helper.py step 4).
      # Turns red under: no-rollback — the box stays dark.
      - name: Leg s5 — a package that dies at boot must land back on OLD, never on nothing
        if: matrix.leg == 's5'
        shell: pwsh
        run: |
          . "$env:GITHUB_WORKSPACE\tests\releases\win_leg_harness.ps1"
          Start-LegServer
          $new = $env:VS_V2
          Build-BrokenWheel $new
          # Same bundle as this install, so the pip path IS the right
          # answer here — the bug is inside the wheel, and only the
          # health check can catch it.
          Write-Release -Version $new -BundleAsset (BundlePath)
          $st = Wait-OnState @('ready', 'error')
          if (-not $st -or $st.state -ne 'ready' -or $st.path -ne 'pip') {
            Fail "expected a ready pip update, got $(Json $st)"
          }
          # The apply happens by itself; what we are waiting for is the
          # ANSWER, not the version. Darkness during the attempt is
          # allowed; staying dark is the bug.
          if (-not (Wait-OnVersion -want $script:Old -tries 500)) {
            Fail "the machine is dark: v$new never booted and v$script:Old was never put back"
          }
          if ((Server-Version) -eq $new) { Fail "v$new answered — it is supposed to die at boot" }
          $rec = Read-Record
          if (-not $rec) { Fail 'the apply left no record at all' }
          if ($rec.status -ne 'rolled_back') {
            Fail "expected a rolled_back record, got $(Json $rec)"
          }
          if ($rec.to -ne $new -or $rec.from -ne $script:Old) {
            Fail "the record is about a different update: $(Json $rec)"
          }
          # Which stage failed is the whole account of the outage: an
          # install that returned nonzero is a different bug from a
          # package that installed and never booted, and only the second
          # one is what a health-checked rollback is for.
          # `health`, the stage the fabricated release died in — and
          # never `rollback`, which is the stage of a recovery that
          # itself failed. The record's stage is quoted verbatim by the
          # refusal, the dialog and the event, so a rolled-back apply
          # that blamed `rollback` told the admin the recovery broke on
          # a machine that had just been put back correctly.
          if ($rec.stage -ne 'health') {
            Fail "the failure was recorded in stage '$($rec.stage)', not the boot/health one"
          }
          # The reverted machine has to SAY so — this is what the admin
          # reads after a restart they did not ask for.
          $st2 = Status
          if (-not $st2.last_update -or $st2.last_update.status -ne 'rolled_back') {
            Fail "update-status does not report the rollback: $(Json $st2)"
          }
          if ($st2.current_version -ne $script:Old) {
            Fail "update-status says current_version=$($st2.current_version)"
          }
          Write-Host "OK: s5 v$new failed, v$script:Old restored and serving, rollback reported"
          Stop-LegServer

      # S5, then the SAME broken release offered again to a fresh boot.
      # Review 4's outage loop: the check cycle has no memory, so six
      # hours later it warms the very build this machine just put back,
      # marks it ready, and the idle tick applies it again — an outage
      # per cycle, forever, for a release that cannot boot. Windows
      # matters most here because the apply rewrites {app}\.venv in
      # place, so a second attempt is a second window in which the
      # machine is not serving. Nothing new is built for this leg: the
      # offer is the same broken wheel, and the only new thing is a
      # reboot, which is how the next cycle arrives on schedule.
      # Turns red under: retry-bad (the tick stops honouring the
      # refusal) and, in the other direction, no-rollback (leg s5).
      - name: Leg s5c — a rolled-back release is never applied again
        if: matrix.leg == 's5c'
        shell: pwsh
        run: |
          . "$env:GITHUB_WORKSPACE\tests\releases\win_leg_harness.ps1"
          Start-LegServer
          $new = $env:VS_V2
          Build-BrokenWheel $new
          Write-Release -Version $new -BundleAsset (BundlePath)
          $st = Wait-OnState @('ready', 'error')
          if (-not $st -or $st.state -ne 'ready' -or $st.path -ne 'pip') {
            Fail "expected a ready pip update, got $(Json $st)"
          }
          # Outage one: it applies itself, dies, and must come back.
          if (-not (Wait-OnVersion -want $script:Old -tries 500)) {
            Fail "the machine is dark: v$new never booted and v$($script:Old) was never put back"
          }
          $rec1 = Read-Record
          if (-not $rec1 -or $rec1.status -ne 'rolled_back') {
            Fail "the first outage left no rollback record: $(Json $rec1)"
          }
          $applies1 = @(Select-String -Path "$script:Updates\pip-apply.log" `
            -Pattern 'applying ' -AllMatches).Count
          if ($applies1 -lt 1) { Fail 'no apply was ever attempted' }
          Write-Host "  outage one recorded: $applies1 apply, rolled_back"
          # Outage two must not happen: reboot into the same offer.
          Restart-LegServer
          $st2 = Wait-OnState @('ready', 'error')
          if (-not $st2 -or $st2.state -ne 'ready') {
            Fail "the broken release was never offered again: $(Json $st2)"
          }
          if ($st2.auto_apply) {
            Fail 'a release this machine rolled back still promises to apply itself'
          }
          if (-not $st2.refusal -or $st2.refusal.version -ne $new) {
            Fail "update-status reports no refusal for ${new}: $(Json $st2)"
          }
          if (-not $st2.popup_due) {
            Fail 'nothing will happen by itself, so the admin must be asked'
          }
          # Two idle intervals past ready: the tick must refuse it.
          Start-Sleep 150
          if ((Server-Version) -ne $script:Old) {
            Fail "it applied the rolled-back release a second time (now $(Server-Version))"
          }
          $applies2 = @(Select-String -Path "$script:Updates\pip-apply.log" `
            -Pattern 'applying ' -AllMatches).Count
          if ($applies2 -ne $applies1) {
            Fail "a second apply started ($applies1 -> $applies2)"
          }
          # The identity, not the bytes: the reboot this leg just forced
          # reports the FIRST outage (`reported: false` -> `true`) and
          # rewrites last.json without any second apply having happened.
          # CI measured exactly that on the Linux leg the same day — the
          # tick logged `refused: …` twice, no second `applying` line
          # existed, and the leg still went red.
          if ((Record-Identity (Read-Record)) -ne (Record-Identity $rec1)) {
            Fail 'the record describes another apply — a second outage happened'
          }
          if (-not (Read-Record).reported) {
            Fail 'the reboot never reported the outage it found on disk'
          }
          if ((Get-Content "$script:Updates\apply-blocked.json" -Raw `
              -ErrorAction SilentlyContinue) -notmatch $new) {
            Fail 'the refusal is not on disk: the next boot would retry it'
          }
          Write-Host "OK: s5c — one outage for v$new, refusal on disk, admin asked"
          Stop-LegServer

      # Two hops: OLD -> v2 (fine) -> v3 (dies at boot). The rollback
      # target is what was SERVING, not what shipped — v2's wheel exists
      # only in the uv cache by then, so this is the hop that catches a
      # rollback pinned to the bundle's own wheel set.
      # Turns red under: no-rollback (dark), and under a rollback that
      # restores the wrong version.
      - name: Leg s5b — broken v3 rolls back to v2, not to OLD
        if: matrix.leg == 's5b'
        shell: pwsh
        run: |
          . "$env:GITHUB_WORKSPACE\tests\releases\win_leg_harness.ps1"
          Start-LegServer
          $v2 = $env:VS_V2
          $v3 = $env:VS_V3
          # Hop 1: a good pip update, applied by itself.
          Build-GoodWheel $v2
          Write-Release -Version $v2 -BundleAsset (BundlePath)
          if (-not (Loop { $s = Status; ($s.state -eq 'ready' -and $s.path -eq 'pip') } 200)) {
            Fail "hop 1 never reached ready(pip): $(Json (Status))"
          }
          if (-not (Wait-OnVersion -want $v2 -tries 420)) {
            Fail "hop 1 did not apply itself (still $(Server-Version))"
          }
          Write-Host "  hop 1 done: serving $v2"
          # Hop 2: the release now dies at boot. v2 is only in the cache,
          # never in {app}\wheels — which is the point of this leg.
          if (Test-Path "$script:Install\wheels\vibe_seller-$v2-py3-none-any.whl") {
            Fail "v2's wheel is in the bundle wheel set; this leg no longer proves the cache is what carries the rollback"
          }
          Build-BrokenWheel $v3
          Write-Release -Version $v3 -BundleAsset (BundlePath)
          if (-not (Loop { $s = Status; ($s.state -eq 'ready' -and $s.path -eq 'pip' -and $s.version -eq $v3) } 200)) {
            Fail "hop 2 never reached ready(pip) for ${v3}: $(Json (Status))"
          }
          if (-not (Wait-OnVersion -want $v2 -tries 500)) {
            $got = Server-Version
            if (-not $got) { Fail "dark: $v3 died and nothing came back" }
            if ($got -eq $script:Old) {
              Fail "rolled back PAST $v2 to the shipped release $script:Old — the rollback target must be what was serving"
            }
            Fail "never came back on $v2 (answering $got, record $(Json (Read-Record)))"
          }
          $rec = Read-Record
          if ($rec.from -ne $v2) {
            Fail "the record started from $($rec.from), not ${v2}: $(Json $rec)"
          }
          if ($rec.status -ne 'rolled_back') { Fail "expected rolled_back, got $(Json $rec)" }
          if ($rec.stage -ne 'health') {
            Fail ("hop 2's failure was recorded in stage " +
                  "'$($rec.stage)', not the boot/health one")
          }
          Write-Host "OK: s5b $script:Old -> $v2 -> broken $v3 -> back on $v2 from the cache"
          Stop-LegServer

      # The staged installer's bytes are not the bytes the release named.
      # One byte flipped AT THE SAME SIZE, so a size check alone cannot
      # catch it — only the sha256 from the release asset can. Nothing
      # may be launched, and an un-verified stage must never exist.
      # Turns red under: no-digest-check.
      - name: Leg s6 — a tampered installer is refused and never launched
        if: matrix.leg == 's6'
        shell: pwsh
        run: |
          . "$env:GITHUB_WORKSPACE\tests\releases\win_leg_harness.ps1"
          Start-LegServer
          $new = $env:VS_V2
          $tamperDir = "$env:RUNNER_TEMP\tampered"
          New-Item -ItemType Directory -Force -Path $tamperDir | Out-Null
          $tampered = Join-Path $tamperDir 'VibeSeller-Setup.exe'
          Copy-Item $script:Exe $tampered
          $real = (Get-FileHash -Algorithm SHA256 $script:Exe).Hash.ToLower()
          $fs = [System.IO.File]::Open($tampered, 'Open', 'ReadWrite')
          try {
            $null = $fs.Seek(4096, 'Begin')
            $b = $fs.ReadByte()
            $fs.Position = 4096
            $fs.WriteByte(($b -bxor 0xFF))
          } finally { $fs.Close() }
          $sizeReal = (Get-Item $script:Exe).Length
          if ((Get-Item $tampered).Length -ne $sizeReal) {
            Fail 'the tampered copy changed size — leg s6 must defeat the DIGEST check, not the size one'
          }
          if ((Get-FileHash -Algorithm SHA256 $tampered).Hash.ToLower() -eq $real) {
            Fail 'flipping a byte did not change the hash — nothing was tampered'
          }
          # A changed bundle so the installer path is the one under test
          # (the pip path never hashes an installer).
          $changed = New-ChangedBundle "$env:RUNNER_TEMP\bundle-changed-s6.json"
          Write-Release -Version $new -BundleAsset $changed `
            -InstallerAsset $tampered -DigestOverride $real
          $st = Wait-OnState @('error', 'ready')
          if (-not $st -or $st.state -ne 'error') {
            Fail "tampered bytes were accepted: $(Json $st)"
          }
          if ($st.error -notmatch 'sha256') {
            Fail "refused for the wrong reason: '$($st.error)' (expected the sha256)"
          }
          if (Test-Path "$script:Updates\$new\VibeSeller-Setup.exe") {
            Fail 'the tampered file was left staged as a ready installer'
          }
          if (Test-Path "$script:Updates\$new\install.log") {
            Fail 'an installer ran'
          }
          if ((Server-Version) -ne $script:Old) { Fail "the app moved to $(Server-Version)" }
          # And the click cannot rescue it: nothing is ready, so there is
          # nothing to launch. 409, not 500 and not a launch.
          $code = $null
          try {
            $code = (Invoke-WebRequest -Method Post `
              "$($script:Base)/api/system/update/restart" -TimeoutSec 20 `
              -UseBasicParsing).StatusCode
          } catch {
            $code = $_.Exception.Response.StatusCode.value__
          }
          if ($code -ne 409) { Fail "restart after a refused stage answered $code, expected 409" }
          Write-Host "OK: s6 refused the tampered installer (sha256), staged nothing, launched nothing"
          Stop-LegServer

      - name: Stop the leg's server + tray
        if: always()
        shell: pwsh
        run: |
          # Best effort, and only what this leg started (never 7777): a
          # relaunched tray keeps pythonw + the server alive on the
          # runner otherwise.
          $install = $env:VS_INSTALL
          if ($install -and (Test-Path "$install\.venv\Scripts\vibe-seller.exe")) {
            & "$install\.venv\Scripts\vibe-seller.exe" stop --port $env:VIBE_SELLER_PORT 2>$null
          }
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object { ($_.Name -eq 'pythonw.exe' -or $_.Name -eq 'python.exe') -and
              $_.ExecutablePath -and $_.ExecutablePath.StartsWith($install, [System.StringComparison]::OrdinalIgnoreCase) -and
              $_.CommandLine -match 'tray\.py' } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }

      - name: Upload the leg's update forensics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: win-${{ matrix.leg }}-updates
          path: |
            ${{ runner.temp }}\vs-${{ matrix.leg }}-home\updates
            ${{ runner.temp }}\vs-${{ matrix.leg }}-release.json
          if-no-files-found: warn
          retention-days: 14

  # The release gate's Windows leg, on the one path that can run it
  # today. `pip-upgrade-gate.yml` is the job that gates a release, and a
  # workflow file that exists only on a branch CANNOT be dispatched —
  # GitHub answers HTTP 404 until the file is on the default branch — so
  # without this job the gate's Windows leg would merge as code nobody
  # has ever executed anywhere. It runs the identical script, from the
  # identical inputs, on the identical runner; the only difference is who
  # asked. `rehearse_gate` is false on every PR, so this job does not
  # exist for normal runs at all.
  gate-rehearsal:
    name: gate rehearsal (previous release -> candidate, pip path)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.rehearse_gate == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VIBE_SELLER_AUTO_UPDATE: '1'
      VIBE_SELLER_PORT: '7795'
      VIBE_SELLER_TELEMETRY: '0'
      VS_V2: '99.9.9'
      PREV_VERSION: ${{ github.event.inputs.prev_version }}
      GATE_FORCE: ${{ github.event.inputs.gate_force }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: The gate hop
        shell: pwsh
        run: |
          $t = $env:RUNNER_TEMP
          $env:VIBE_HOME = "$t\vs-rehearse-home"
          $env:VIBE_SELLER_RELEASES_URL = "$t\vs-rehearse-release.json"
          $env:UV_FIND_LINKS = "$t\dist"
          $env:VS_DIST = "$t\dist"
          # An explicit policy: this shell would otherwise be
          # governed by the machine's execution policy, which is
          # not something a leg should have to know.
          pwsh -NoProfile -ExecutionPolicy Bypass -File `
            ./tests/releases/win_gate_leg.ps1

          # A child pwsh's exit code is NOT a PowerShell error: a script
          # that throws in the child leaves THIS step to finish normally
          # and report success, and this job exists to show the gate's
          # Windows leg can go red.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stop the leg's server + tray
        if: always()
        shell: pwsh
        run: |
          $install = "$env:LOCALAPPDATA\Programs\VibeSeller"
          if (Test-Path "$install\.venv\Scripts\vibe-seller.exe") {
            & "$install\.venv\Scripts\vibe-seller.exe" stop --port 7795 2>$null
          }
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object { ($_.Name -eq 'pythonw.exe' -or $_.Name -eq 'python.exe') -and
              $_.ExecutablePath -and
              $_.ExecutablePath.StartsWith($install, [System.StringComparison]::OrdinalIgnoreCase) } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }

      - name: Upload the rehearsal's forensics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-rehearsal-windows
          path: |
            ${{ runner.temp }}\vs-rehearse-home
          if-no-files-found: ignore
