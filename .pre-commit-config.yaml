repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
        args: ['--allow-multiple-documents']
        # mkdocs.yml intentionally uses !!python/name tags (pymdownx slugs,
        # emoji index) that safe YAML loaders cannot construct.
        exclude: '^(mkdocs\.yml|\.?mkdocs\.yaml)$'
    -   id: check-added-large-files
        # Demo GIFs/mp4s and screenshots committed under docs/ are the
        # exception to the 500 KB limit — nothing else may exceed it.
        exclude: '^docs/(images|videos)/'

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
    -   id: ruff
        name: ruff lint
        args: ['--fix']
    -   id: ruff-format
        name: ruff format

-   repo: local
    hooks:
    -   id: readme-sync
        name: READMEs regenerated from docs/index*.md
        entry: python3 scripts/gen_readme.py --check
        language: system
        files: ^(docs/index(\.en)?\.md|README(_en)?\.md)$
        pass_filenames: false

    -   id: frontend-lint
        name: frontend lint
        entry: bash -c 'cd frontend && npm run lint'
        language: node
        language_version: 24.12.0
        files: ^frontend/
        pass_filenames: false

    -   id: frontend-typecheck
        name: frontend typecheck
        entry: bash -c 'cd frontend && npx tsc -b'
        language: node
        language_version: 24.12.0
        files: ^frontend/
        pass_filenames: false

    -   id: line-limit
        name: enforce 800-line limit
        entry: scripts/check_line_limit.sh
        language: system
        files: ^(app/.*\.py|frontend/src/.*\.(ts|tsx))$
        # The provider catalog is data, not a code module, and cannot be
        # split: the presets sync (app/ai/provider_presets_sync.py) on every
        # released client fetches this ONE file from main and requires both
        # PROVIDER_PRESETS and PROVIDER_MODELS literals in it. The model
        # pricing snapshot is generated data too (one literal, written by
        # scripts/gen_model_pricing_snapshot.py).
        exclude: ^app/ai/(provider_presets|model_pricing_snapshot)\.py$
