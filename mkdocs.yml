# MkDocs configuration for the vibe-seller documentation site.
#
# docs/ is the single source of truth: docs/index.md (zh) and
# docs/index.en.md (en) are committed homepages; the GitHub READMEs are
# generated from them by scripts/gen_readme.py. Build locally with:
#   .venv-docs/bin/mkdocs serve   /   .venv-docs/bin/mkdocs build --strict

site_name: Vibe Seller
site_url: https://docs.vibe-sellers.com/
site_description: >-
  AI browser-automation framework for cross-border sellers. Locally
  deployed, per-store isolation, any LLM provider — agents drive Ziniao or
  Chrome to run ad tuning, listings, reports and audits.

repo_url: https://github.com/zpoint/vibe-seller
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
# docs/README.md is a GitHub-only index page; the site builds its own nav.
# docs/requirements.txt pins the CI build deps — a build input, not site
# content.
exclude_docs: |
  README.md
  requirements.txt

hooks:
  - docs_hooks.py

theme:
  name: material
  language: zh
  # overrides/partials/{toc,content}.html move the "Edit on GitHub" link
  # from beside the title into the right-hand column (SkyPilot's layout)
  # and give that column a labelled header. Everything else is Material's.
  custom_dir: overrides
  font: false  # system fonts: the audience includes users behind the GFW
  # Same mark as the app (frontend/public/vibe-seller.svg): header logo
  # and browser-tab icon.
  logo: vibe-seller.svg
  favicon: vibe-seller.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - content.action.edit
    - content.tooltips
    - navigation.tracking
    - navigation.top
    # Two top-level tabs (Docs / Developer), sidebar sections under them,
    # always expanded, with a prev/next pager. No navigation.path: the
    # breadcrumb row repeated the sidebar on every page.
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    # navigation.indexes is deliberately NOT enabled: it only folds a page
    # literally named index.md into its section title, so it cannot make
    # 群机器人 / MCP 接入 clickable (those overviews are chat-bots.md / mcp.md
    # and stay the first row of the submenu) — it would only drop the 首页 row
    # out of the sidebar into the 文档 tab title.
    - navigation.footer
    - search.highlight
    - search.share
    - toc.follow
  palette:
    # White header in light mode, near-black in dark; the brand indigo
    # comes from docs/stylesheets/extra.css (--md-accent-fg-color).
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: white
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: black
      toggle:
        icon: material/weather-night
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - social:
      cards: true
  - i18n:
      docs_structure: suffix
      languages:
        - locale: zh
          name: 简体中文
          default: true
          build: true
          # Chinese nav labels for the (English) section and page titles.
          # Only user-facing pages get translated: everything under the
          # "Developer (English)" section keeps its English title even in
          # the Chinese build, so the nav itself says which pages have no
          # Chinese version (docs_hooks.py adds the same note in-page).
          nav_translations:
            Docs: 文档
            Home: 首页
            Getting Started: 入门
            Installation: 安装
            Quickstart: 快速开始
            Configure AI Models: 配置 AI 模型
            Core Concepts: 核心概念
            Examples: 使用示例
            All Examples: 全部示例
            Daily Email Digest to WeCom: 每天把重要邮件发到企业微信
            Weekly Ad ACOS Review: 每周检查广告 ACOS
            Weekly Listing Check: 每周巡检 Listing
            Daily Sales Report: 每天导出销售报表
            Drive It from Claude / Codex: 在 Claude / Codex 里使用
            User Guide: 使用指南
            Stores & Browsers: 店铺与浏览器
            Tasks: 任务
            Schedules: 定时任务
            Knowledge & Skills: 知识库与 Skill
            FAQ: 常见问题
            "Ziniao: Setup & Common Errors": 紫鸟：开通与常见报错
            Cost & Model Choice: 费用与模型选择
            Login & Accounts: 登录与账号
            Deployment & Data: 部署与数据
            All Questions: 全部问题
            Community & Feedback: 加入社区与问题反馈
            Integrations: 集成
            Overview: 集成总览
            MCP Setup: MCP 接入
            Amazon Ads API: 广告 API 绑定
            Email: 邮件
            Chat Bots: 群机器人
            MCP Overview: MCP 接入总览
            Chat Bot Overview: 群机器人总览
            # Per-platform pages under 群机器人; the tool names under MCP
            # 接入 (Claude / Codex / …) stay as names in both languages.
            WeCom: 企业微信
            DingTalk: 钉钉
            "Feishu / Lark": 飞书
            Slack: Slack
            TickTick / Dida365: 滴答清单 / TickTick
            Developer (English): 开发者文档（英文）
        - locale: en
          name: English
          build: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Unicode-preserving slugs so CJK anchors (e.g. #安装) match the
      # in-page links the READMEs already use on GitHub.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.betterem
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Content tabs ("界面操作" / "命令行 / 配置文件" per MCP tool page), mirroring
  # the two tabs in the API key dialog. alternate_style renders them with
  # Material's .md-tabs markup; the mobile display fix lives in extra.css.
  - pymdownx.tabbed:
      alternate_style: true

# Two top-level tabs (navigation.tabs): the product docs in the reader's
# own language, and the English-only operator / contributor reference.
# Everything nested inside a tab becomes a sidebar section under it.
nav:
  - Docs:
      - Home: index.md
      - Getting Started:
          - Installation: install.md
          - Quickstart: quickstart.md
          - Configure AI Models: llm-keys.md
          - Core Concepts: concepts.md
      - Integrations:
          - Overview: integrations.md
          # Each section's overview page is its first child, so the submenu
          # shows 总览 / Overview plus the per-platform or per-tool pages.
          # (navigation.indexes only folds a page into the section title when
          # the file is named index.md; these overviews keep their own URLs.)
          - MCP Setup:
              - MCP Overview: mcp.md
              - Codex: mcp-codex.md
              - WorkBuddy: mcp-workbuddy.md
              - Qoder: mcp-qoder.md
              - Hermes Agent: mcp-hermes.md
              - Pi: mcp-pi.md
              - Claude: mcp-claude.md
          - Amazon Ads API: ads-api.md
          - Email: email.md
          - Chat Bots:
              - Chat Bot Overview: chat-bots.md
              - WeCom: chat-bots-wecom.md
              - DingTalk: chat-bots-dingtalk.md
              - Feishu / Lark: chat-bots-feishu.md
              - Slack: chat-bots-slack.md
          - TickTick / Dida365: ticktick.md
          - Google Workspace: google-workspace.md
      - Examples:
          - All Examples: examples.md
          - Daily Email Digest to WeCom: example-email-wecom.md
          - Weekly Ad ACOS Review: example-ads-acos.md
          - Weekly Listing Check: example-listing-check.md
          - Daily Sales Report: example-daily-report.md
          - Drive It from Claude / Codex: example-mcp.md
      - User Guide:
          - Stores & Browsers: stores.md
          - Tasks: using-tasks.md
          - Schedules: schedules.md
          - Knowledge & Skills: knowledge.md
      - FAQ:
          - "Ziniao: Setup & Common Errors": ziniao.md
          - Cost & Model Choice: faq-cost.md
          - Login & Accounts: faq-login.md
          - Deployment & Data: faq-data.md
          - All Questions: faq.md
      - Community & Feedback: community.md
  # English-only reference. The titles stay English in the Chinese build
  # too — see nav_translations.
  - Developer (English):
      - Developer Guide: dev-guide.md
      - Task Internals: tasks.md
      - Workspace Internals: workspace.md
      - Subsystems: subsystems.md
      - Events: events.md
      - Browser Internals: browser.md
      - Ziniao Concurrency: ziniao-concurrency.md
      - browser-use 0.13 Migration: browser-use-0.13-migration.md
      - Backend: backend.md
      - Frontend: frontend.md
      - API Routes: api.md
      - External Agents (MCP API): agents.md
      - Testing: testing.md
      - Telemetry: telemetry.md
      - Vision Internals: vision.md
      - Windows + WSL2 Service: windows-setup.md
      - macOS Service: macos-setup.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zpoint/vibe-seller

watch:
  - docs_hooks.py
