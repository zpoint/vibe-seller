# MkDocs configuration for the vibe-seller documentation site.
#
# docs/ is the single source of truth: docs/index.md (zh) and
# docs/index.en.md (en) are committed homepages; the GitHub READMEs are
# generated from them by scripts/gen_readme.py. Build locally with:
#   .venv-docs/bin/mkdocs serve   /   .venv-docs/bin/mkdocs build --strict

site_name: Vibe Seller
site_url: https://docs.vibe-sellers.com/
site_description: >-
  AI browser-automation framework for cross-border sellers. Locally
  deployed, per-store isolation, any LLM provider — agents drive Ziniao or
  Chrome to run ad tuning, listings, reports and audits.

repo_url: https://github.com/zpoint/vibe-seller
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
# docs/README.md is a GitHub-only index page; the site builds its own nav.
# docs/requirements.txt pins the CI build deps — a build input, not site
# content.
exclude_docs: |
  README.md
  requirements.txt

hooks:
  - docs_hooks.py

theme:
  name: material
  language: zh
  font: false  # system fonts: the audience includes users behind the GFW
  icon:
    logo: material/robot-outline
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - content.action.edit
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - search.highlight
    - search.share
    - toc.follow
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode

plugins:
  - search
  - social:
      cards: true
  - i18n:
      docs_structure: suffix
      languages:
        - locale: zh
          name: 简体中文
          default: true
          build: true
          # Chinese nav labels for the (English) section and page titles.
          nav_translations:
            Home: 首页
            Getting Started: 入门
            Core: 核心
            Browser Automation: 浏览器自动化
            Reference: 参考
            Developer Guide: 开发者指南
            Windows + WSL2 Deployment: Windows + WSL2 部署
            macOS Deployment: macOS 部署
            Amazon Ads API: 广告 API 绑定
            Tasks: 任务
            Workspace: 工作区
            Subsystems: 子系统
            Events: 事件
            Browser Management: 浏览器管理
            Ziniao Concurrency: 紫鸟并发
            browser-use 0.13 Migration: browser-use 0.13 迁移
            Backend: 后端
            Frontend: 前端
            API Routes: API 路由
            Testing: 测试
            Telemetry: 遥测
            Vision — AI Images: AI 图像生成
            Skill Review Mechanism: Skill 审查机制
        - locale: en
          name: English
          build: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Unicode-preserving slugs so CJK anchors (e.g. #安装) match the
      # in-page links the READMEs already use on GitHub.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.betterem
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting Started:
      - Developer Guide: dev-guide.md
      - Windows + WSL2 Deployment: windows-setup.md
      - macOS Deployment: macos-setup.md
      - Amazon Ads API: ads-api.md
  - Core:
      - Tasks: tasks.md
      - Workspace: workspace.md
      - Subsystems: subsystems.md
      - Events: events.md
  - Browser Automation:
      - Browser Management: browser.md
      - Ziniao Concurrency: ziniao-concurrency.md
      - browser-use 0.13 Migration: browser-use-0.13-migration.md
  - Reference:
      - Backend: backend.md
      - Frontend: frontend.md
      - API Routes: api.md
      - Connect an External Agent: agents.md
      - Testing: testing.md
      - Telemetry: telemetry.md
      - Vision — AI Images: vision.md
      - Skill Review Mechanism: skill-review-mechanism.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zpoint/vibe-seller

watch:
  - docs_hooks.py
