[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --tb=short
markers =
    unit: Unit tests (fast, isolated)
    workflow: API workflow tests (real DB, mock agent)
    integration: Integration tests (database, API)
    e2e: End-to-end tests (browser automation)
    ziniao: Ziniao browser tests (local only, requires Ziniao + credentials)
    ai: AI integration tests (requires API keys)
    windows: Windows-specific tests (deselected unless --windows or on Windows)
    asyncio: Async tests

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error
    # google.api_core announces, from one year before a Python version's
    # end of life, that future releases will drop it -- at IMPORT time.
    # On 3.11 that started 2026-10-24, and with `error` above it stopped
    # tests/conftest.py from loading at all (app.main imports the Google
    # Calendar backend). A support-policy notice about a dependency, not a
    # defect in this code; every other warning still fails the run.
    ignore:You are using a Python version .* which Google will stop supporting:FutureWarning
    # pytest 9.2 deprecates session-scoped fixtures defined as instance
    # methods, and pytest-playwright 0.10's fallback `base_url` fixture
    # (registered when pytest-base-url isn't installed) is one. With
    # `error` above, every e2e test that touches `page` errored at setup.
    # Upstream plugin code, not ours.
    ignore:Session-scoped fixtures defined as instance methods are deprecated
    ignore::DeprecationWarning:pkg_resources
    ignore::DeprecationWarning:pytest_asyncio
    ignore::pytest.PytestUnraisableExceptionWarning
